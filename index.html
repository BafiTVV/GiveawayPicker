<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Giveaway Picker 🎯</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(23, 32, 54, 0.6);
      --accent-grad: linear-gradient(135deg, #833ab4 0%, #fd1d1d 50%, #fcb045 100%);
      --glow-color: rgba(253, 29, 29, 0.4);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(131, 58, 180, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(253, 29, 29, 0.15) 0%, transparent 40%);
    }

    .container {
      max-width: 800px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      flex: 1;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 2rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .inputs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    @media (max-width: 600px) {
      .inputs-grid {
        grid-template-columns: 1fr;
      }
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    textarea {
      width: 100%;
      height: 140px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem;
      color: #fff;
      font-size: 0.95rem;
      resize: vertical;
      transition: all 0.3s ease;
    }

    textarea:focus {
      outline: none;
      border-color: #fd1d1d;
      box-shadow: 0 0 15px var(--glow-color);
    }

    .stats {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
    }

    /* Slot Machine Reel */
    .slot-container {
      position: relative;
      min-height: 140px;
      padding: 1.5rem;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 16px;
      border: 2px solid var(--border-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .slot-prize {
      font-size: 1.2rem;
      font-weight: 800;
      color: #fcb045;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.4rem;
    }

    .slot-name {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #fff;
      text-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    .slot-container.winner .slot-name {
      font-size: 2.6rem;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: pulse 0.5s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.06); }
    }

    .btn-main {
      width: 100%;
      padding: 1.2rem;
      border: none;
      border-radius: 16px;
      background: var(--accent-grad);
      color: #fff;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 25px var(--glow-color);
      transition: all 0.3s ease;
    }

    .btn-main:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px var(--glow-color);
    }

    .btn-main:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-sec {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
    }

    .congrats-banner {
      background: var(--accent-grad);
      padding: 1.5rem;
      border-radius: 16px;
      text-align: center;
      font-size: 1.8rem;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 10px 30px var(--glow-color);
      animation: fadeIn 0.5s ease;
    }

    /* History section */
    .history-section {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .winner-badge {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      padding: 0.8rem 1.2rem;
      border-radius: 12px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: fadeIn 0.4s ease;
    }

    .winner-badge .prize-tag {
      color: #fcb045;
      font-weight: 800;
    }

    .winner-badge .user-tag {
      color: #fff;
      font-size: 1.1rem;
    }

    .reroll-btn {
      background: rgba(253, 29, 29, 0.2);
      border: 1px solid #fd1d1d;
      color: #ff6b6b;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      margin-left: 1rem;
    }

    .reroll-btn:hover {
      background: #fd1d1d;
      color: #fff;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Footer styling */
    footer {
      margin-top: 3rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    footer span {
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>INSTAGRAM LOSOVAČ 🎁</h1>
      <p id="headerSubtitle">Nastavení výher a účastníků</p>
    </header>

    <!-- OBRAZOVKA 1: NASTAVENÍ -->
    <main id="setupScreen" class="glass-card">
      <div class="inputs-grid">
        <div class="input-group">
          <label for="prizesInput">🎁 Seznam výher (1 na řádek):</label>
          <textarea id="prizesInput" placeholder="1. Místo: iPhone&#10;2. Místo: Poukaz 1000 Kč&#10;3. Místo: Merch"></textarea>
        </div>
        <div class="input-group">
          <label for="usersInput">👥 Seznam účastníků (Ctrl+V):</label>
          <textarea id="usersInput" placeholder="Zde vlož zkopírovaná jména z konzole (@jméno)..." oninput="updateCount()"></textarea>
        </div>
      </div>

      <div class="stats">
        <span>Počet načtených účtů: <strong id="userCount" style="color: #fff;">0</strong></span>
      </div>

      <button class="btn-main" onclick="goToRollScreen()">PŘEJÍT K LOSOVÁNÍ 🚀</button>
    </main>

    <!-- OBRAZOVKA 2: PREZENTACE LOSOVÁNÍ (Sken) -->
    <main id="rollScreen" class="glass-card hidden">
      <div id="slotContainer" class="slot-container">
        <div id="slotPrize" class="slot-prize">PŘIPRAVENO</div>
        <div id="slotDisplay" class="slot-name">---</div>
      </div>

      <div id="controlsContainer">
        <button id="rollBtn" class="btn-main" onclick="startRoll()">SPUSTIT LOSOVÁNÍ 🚀</button>
      </div>

      <div id="congratsBanner" class="congrats-banner hidden">
        🎉 GRATULUJEME VÝHERCŮM! 🎉
      </div>
    </main>

    <!-- KARTA HISTORIE (Běží na obou obrazovkách) -->
    <div id="historyCard" class="glass-card history-section hidden">
      <div class="history-header">
        <h3>🏆 Seznam výherců</h3>
        <button id="backToSetupBtn" class="btn-sec" onclick="goToSetupScreen()">⚙️ Upravit nastavení</button>
      </div>
      <div id="winnersList" class="history-list"></div>
    </div>
  </div>

  <footer>
    <p>© DEV - <span>BAFI</span> | BigMoments 2026</p>
  </footer>

  <script>
    let isRolling = false;
    let db = {
      prizes: [],
      users: [],
      winnersHistory: []
    };

    // Načtení z databáze (LocalStorage) při otevření
    window.onload = function() {
      const savedData = localStorage.getItem('ig_picker_db');
      if (savedData) {
        db = JSON.parse(savedData);
        if (db.winnersHistory.length > 0) {
          renderHistory();
        }
      }
    };

    function saveToDB() {
      localStorage.setItem('ig_picker_db', JSON.stringify(db));
    }

    function getCleanUsers() {
      const text = document.getElementById('usersInput').value;
      return text.split('\n').map(u => u.trim()).filter(u => u.length > 0);
    }

    function getPrizes() {
      const text = document.getElementById('prizesInput').value;
      return text.split('\n').map(p => p.trim()).filter(p => p.length > 0);
    }

    function updateCount() {
      const users = getCleanUsers();
      document.getElementById('userCount').innerText = users.length;
    }

    function goToRollScreen() {
      const users = getCleanUsers();
      const prizes = getPrizes();

      if (users.length === 0) {
        alert("⚠️ Nejprve do pole vlož seznam jmen!");
        return;
      }

      db.users = users;
      db.prizes = prizes;
      saveToDB();

      document.getElementById('setupScreen').classList.add('hidden');
      document.getElementById('rollScreen').classList.remove('hidden');
      document.getElementById('historyCard').classList.remove('hidden');
      document.getElementById('headerSubtitle').innerText = "Exkluzivní losování";

      updateRollUI();
    }

    function goToSetupScreen() {
      document.getElementById('setupScreen').classList.remove('hidden');
      document.getElementById('rollScreen').classList.add('hidden');
      document.getElementById('headerSubtitle').innerText = "Nastavení výher a účastníků";
    }

    function updateRollUI() {
      const slotPrize = document.getElementById('slotPrize');
      const rollBtn = document.getElementById('rollBtn');
      const congratsBanner = document.getElementById('congratsBanner');
      const controlsContainer = document.getElementById('controlsContainer');

      if (db.prizes.length > 0) {
        slotPrize.innerText = `NÁSLEDUJÍCÍ VÝHRA: ${db.prizes[0]}`;
        controlsContainer.classList.remove('hidden');
        congratsBanner.classList.add('hidden');
      } else if (db.winnersHistory.length > 0) {
        // Všechny výhry byly rozlosovány
        controlsContainer.classList.add('hidden');
        congratsBanner.classList.remove('hidden');
        slotPrize.innerText = "SOUTĚŽ UKONČENA";
        document.getElementById('slotDisplay').innerText = "Všechny ceny mají své majitele!";
      } else {
        slotPrize.innerText = "ŽÁDNÉ VÝHRY NEBYLY ZADÁNY";
      }
    }

    function startRoll() {
      if (db.users.length === 0 || db.prizes.length === 0) return;
      if (isRolling) return;
      isRolling = true;

      const rollBtn = document.getElementById('rollBtn');
      const slotContainer = document.getElementById('slotContainer');
      const slotDisplay = document.getElementById('slotDisplay');
      const slotPrize = document.getElementById('slotPrize');
      
      rollBtn.disabled = true;
      slotContainer.classList.remove('winner');

      const currentPrize = db.prizes[0];
      const winnerIndex = Math.floor(Math.random() * db.users.length);
      const winner = db.users[winnerIndex];

      const duration = 3000;
      const startTime = Date.now();
      let intervalSpeed = 25;

      function animate() {
        const elapsedTime = Date.now() - startTime;

        if (elapsedTime < duration) {
          const randomName = db.users[Math.floor(Math.random() * db.users.length)];
          slotDisplay.innerText = randomName;

          if (elapsedTime > duration - 800) {
            intervalSpeed += 5;
          }

          setTimeout(animate, intervalSpeed);
        } else {
          // Zastavení a vyhlášení
          slotDisplay.innerText = winner;
          slotPrize.innerText = `🎉 ${currentPrize}`;
          slotContainer.classList.add('winner');
          
          fireConfetti();

          // Uložení do databáze
          db.winnersHistory.unshift({ prize: currentPrize, user: winner });
          db.prizes.shift(); // Odebrání rozlosované výhry
          saveToDB();

          renderHistory();
          rollBtn.disabled = false;
          isRolling = false;

          updateRollUI();
        }
      }

      animate();
    }

    function fireConfetti() {
      confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
    }

    function renderHistory() {
      const list = document.getElementById('winnersList');
      list.innerHTML = '';

      db.winnersHistory.forEach((item, index) => {
        const badge = document.createElement('div');
        badge.className = 'winner-badge';
        badge.innerHTML = `
          <span class="prize-tag">🎁 ${item.prize}</span>
          <span class="user-tag">${item.user}</span>
          <button class="reroll-btn" onclick="rerollWinner(${index})">🔄 Reroll</button>
        `;
        list.appendChild(badge);
      });
    }

    // Funkce pro REROLL (vrácení výhry a odstranění výherce)
    function rerollWinner(index) {
      if (confirm("Opravdu chceš vrátit tuto výhru zpět do osudí a vylosovat ji znovu?")) {
        const removed = db.winnersHistory.splice(index, 1)[0];
        db.prizes.unshift(removed.prize); // Vrátí výhru na první místo
        saveToDB();
        
        renderHistory();
        updateRollUI();
        document.getElementById('slotContainer').classList.remove('winner');
        document.getElementById('slotDisplay').innerText = "Příprava na Reroll...";
      }
    }
  </script>
</body>
</html>
