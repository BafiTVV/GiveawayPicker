<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Giveaway Picker 🎯</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(23, 32, 54, 0.6);
      --accent-grad: linear-gradient(135deg, #833ab4 0%, #fd1d1d 50%, #fcb045 100%);
      --glow-color: rgba(253, 29, 29, 0.4);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(131, 58, 180, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(253, 29, 29, 0.15) 0%, transparent 40%);
    }

    .container {
      max-width: 800px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      flex: 1;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 2rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .inputs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    @media (max-width: 600px) {
      .inputs-grid {
        grid-template-columns: 1fr;
      }
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    textarea {
      width: 100%;
      height: 140px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem;
      color: #fff;
      font-size: 0.95rem;
      resize: vertical;
      transition: all 0.3s ease;
    }

    textarea:focus {
      outline: none;
      border-color: #fd1d1d;
      box-shadow: 0 0 15px var(--glow-color);
    }

    .stats {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
    }

    /* Slot Machine Reel */
    .slot-container {
      position: relative;
      min-height: 120px;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 16px;
      border: 2px solid var(--border-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .slot-prize {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fcb045;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.2rem;
      display: none;
    }

    .slot-name {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #fff;
      text-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    .slot-container.winner .slot-prize {
      display: block;
    }

    .slot-container.winner .slot-name {
      font-size: 2.5rem;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: pulse 0.5s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.06); }
    }

    .btn-roll {
      width: 100%;
      padding: 1.2rem;
      border: none;
      border-radius: 16px;
      background: var(--accent-grad);
      color: #fff;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 25px var(--glow-color);
      transition: all 0.3s ease;
    }

    .btn-roll:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px var(--glow-color);
    }

    .btn-roll:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* History section */
    .history-section {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .winner-badge {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      padding: 0.8rem 1.2rem;
      border-radius: 12px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: fadeIn 0.4s ease;
    }

    .winner-badge .prize-tag {
      color: #fcb045;
      font-weight: 800;
    }

    .winner-badge .user-tag {
      color: #fff;
      font-size: 1.1rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Footer styling */
    footer {
      margin-top: 3rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    footer span {
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>INSTAGRAM LOSOVAČ 🎁</h1>
      <p>Vlož vyčištěný seznam ze schránky a vylosuj výherce!</p>
    </header>

    <main class="glass-card">
      <div class="inputs-grid">
        <div class="input-group">
          <label for="prizesInput">🎁 Seznam výher (1 na řádek):</label>
          <textarea id="prizesInput" placeholder="1. Místo: IPhone&#10;2. Místo: Poukaz 1000Kč&#10;3. Místo: Merch"></textarea>
        </div>
        <div class="input-group">
          <label for="usersInput">👥 Seznam účastníků (Ctrl+V):</label>
          <textarea id="usersInput" placeholder="Zde vlož zkopírovaná jména z konzole (@jméno)..." oninput="updateCount()"></textarea>
        </div>
      </div>

      <div class="stats">
        <span>Počet načtených účtů: <strong id="userCount" style="color: #fff;">0</strong></span>
      </div>

      <div id="slotContainer" class="slot-container">
        <div id="slotPrize" class="slot-prize"></div>
        <div id="slotDisplay" class="slot-name">Připraveno k losování</div>
      </div>

      <button id="rollBtn" class="btn-roll" onclick="startRoll()">SPUSTIT LOSOVÁNÍ (3s) 🚀</button>
    </main>

    <div class="glass-card history-section">
      <h3>🏆 Seznam výherců</h3>
      <div id="winnersList" class="history-list">
        <!-- Výherci se budou přidávat sem -->
      </div>
    </div>
  </div>

  <footer>
    <p>© DEV - <span>BAFI</span> | BigMoments 2026</p>
  </footer>

  <script>
    let isRolling = false;

    function getCleanUsers() {
      const text = document.getElementById('usersInput').value;
      return text.split('\n')
                 .map(u => u.trim())
                 .filter(u => u.length > 0);
    }

    function getPrizes() {
      const text = document.getElementById('prizesInput').value;
      return text.split('\n')
                 .map(p => p.trim())
                 .filter(p => p.length > 0);
    }

    function updateCount() {
      const users = getCleanUsers();
      document.getElementById('userCount').innerText = users.length;
    }

    function startRoll() {
      const users = getCleanUsers();
      const prizes = getPrizes();

      if (users.length === 0) {
        alert("⚠️ Nejprve do pole vlož seznam jmen!");
        return;
      }

      if (isRolling) return;
      isRolling = true;

      const rollBtn = document.getElementById('rollBtn');
      const slotContainer = document.getElementById('slotContainer');
      const slotDisplay = document.getElementById('slotDisplay');
      const slotPrize = document.getElementById('slotPrize');
      
      rollBtn.disabled = true;
      slotContainer.classList.remove('winner');
      slotPrize.style.display = 'none';

      // Náhodná výhra (nebo první v seznamu, pokud je zadaná)
      const currentPrize = prizes.length > 0 ? prizes[0] : "Výhra";

      // Náhodný výherce
      const winnerIndex = Math.floor(Math.random() * users.length);
      const winner = users[winnerIndex];

      const duration = 3000; // Přesně 3 sekundy
      const startTime = Date.now();
      let intervalSpeed = 25; // Rychlé střídání (každých 25ms)

      function animate() {
        const elapsedTime = Date.now() - startTime;

        if (elapsedTime < duration) {
          // Během 3s se velmi rychle střídají náhodná jména
          const randomName = users[Math.floor(Math.random() * users.length)];
          slotDisplay.innerText = randomName;

          // Mírné plynulé zpomalení těsně před koncem (posledních 800ms)
          if (elapsedTime > duration - 800) {
            intervalSpeed += 5;
          }

          setTimeout(animate, intervalSpeed);
        } else {
          // Zastavení na výherci po 3s
          slotDisplay.innerText = winner;
          slotPrize.innerText = `🎉 ${currentPrize}`;
          slotPrize.style.display = 'block';
          slotContainer.classList.add('winner');
          
          fireConfetti();
          addWinnerToHistory(currentPrize, winner);

          // Pokud bylo více výher, odebereme odehranou výhru ze seznamu
          if (prizes.length > 0) {
            prizes.shift();
            document.getElementById('prizesInput').value = prizes.join('\n');
          }

          rollBtn.disabled = false;
          isRolling = false;
        }
      }

      animate();
    }

    function fireConfetti() {
      confetti({
        particleCount: 150,
        spread: 80,
        origin: { y: 0.6 }
      });
    }

    function addWinnerToHistory(prize, winner) {
      const list = document.getElementById('winnersList');
      const badge = document.createElement('div');
      badge.className = 'winner-badge';
      badge.innerHTML = `
        <span class="prize-tag">🎁 ${prize}</span>
        <span class="user-tag">${winner}</span>
      `;
      list.prepend(badge);
    }
  </script>
</body>
</html>
