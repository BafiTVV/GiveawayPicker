<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Giveaway Picker 🎯</title>
  <!-- Google Fonts & Canvas Confetti -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(23, 32, 54, 0.6);
      --accent-grad: linear-gradient(135deg, #833ab4 0%, #fd1d1d 50%, #fcb045 100%);
      --glow-color: rgba(253, 29, 29, 0.4);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(131, 58, 180, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(253, 29, 29, 0.15) 0%, transparent 40%);
    }

    .container {
      max-width: 800px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      flex: 1;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 2rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    label {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    textarea {
      width: 100%;
      height: 140px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem;
      color: #fff;
      font-size: 0.95rem;
      resize: vertical;
      transition: all 0.3s ease;
    }

    textarea:focus {
      outline: none;
      border-color: #fd1d1d;
      box-shadow: 0 0 15px var(--glow-color);
    }

    .stats {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: -0.5rem;
      margin-bottom: 1.5rem;
    }

    /* Slot Machine Reel */
    .slot-container {
      position: relative;
      height: 120px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 16px;
      border: 2px solid var(--border-color);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
      margin-bottom: 1.5rem;
    }

    .slot-container::before, .slot-container::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 30px;
      z-index: 2;
      pointer-events: none;
    }

    .slot-container::before {
      top: 0;
      background: linear-gradient(to bottom, rgba(11,15,25,0.9), transparent);
    }

    .slot-container::after {
      bottom: 0;
      background: linear-gradient(to top, rgba(11,15,25,0.9), transparent);
    }

    .slot-name {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #fff;
      text-shadow: 0 0 10px rgba(255,255,255,0.3);
      transition: transform 0.1s ease;
    }

    .slot-name.winner {
      font-size: 2.6rem;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: pulse 0.6s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }

    .btn-roll {
      width: 100%;
      padding: 1.2rem;
      border: none;
      border-radius: 16px;
      background: var(--accent-grad);
      color: #fff;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 25px var(--glow-color);
      transition: all 0.3s ease;
    }

    .btn-roll:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px var(--glow-color);
    }

    .btn-roll:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* History section */
    .history-section {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .history-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .winner-badge {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      padding: 0.6rem 1.2rem;
      border-radius: 50px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Footer styling */
    footer {
      margin-top: 3rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    footer span {
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>INSTAGRAM LOSOVAČ 🎁</h1>
      <p>Vlož vyčištěný seznam ze schránky a vylosuj výherce!</p>
    </header>

    <main class="glass-card">
      <div class="input-group">
        <label for="usersInput">Seznam účastníků (Ctrl+V):</label>
        <textarea id="usersInput" placeholder="Zde vlož zkopírovaná jména z konzole (@jméno)..." oninput="updateCount()"></textarea>
      </div>

      <div class="stats">
        <span>Počet načtených účtů: <strong id="userCount" style="color: #fff;">0</strong></span>
      </div>

      <div class="slot-container">
        <div id="slotDisplay" class="slot-name">Připraveno k losování</div>
      </div>

      <button id="rollBtn" class="btn-roll" onclick="startRoll()">SPUSTIT LOSOVÁNÍ 🚀</button>
    </main>

    <div class="glass-card history-section">
      <h3>🏆 Seznam výherců</h3>
      <div id="winnersList" class="history-list">
        <!-- Výherci se budou přidávat sem -->
      </div>
    </div>
  </div>

  <footer>
    <p>© DEV - <span>BAFI</span> | BigMoments 2026</p>
  </footer>

  <script>
    let isRolling = false;

    function getCleanUsers() {
      const text = document.getElementById('usersInput').value;
      return text.split('\n')
                 .map(u => u.trim())
                 .filter(u => u.length > 0);
    }

    function updateCount() {
      const users = getCleanUsers();
      document.getElementById('userCount').innerText = users.length;
    }

    function startRoll() {
      const users = getCleanUsers();

      if (users.length === 0) {
        alert("⚠️ Nejprve do pole vlož seznam jmen!");
        return;
      }

      if (isRolling) return;
      isRolling = true;

      const rollBtn = document.getElementById('rollBtn');
      const slotDisplay = document.getElementById('slotDisplay');
      
      rollBtn.disabled = true;
      slotDisplay.classList.remove('winner');

      let counter = 0;
      let totalRounds = 40;
      let speed = 50;

      const winnerIndex = Math.floor(Math.random() * users.length);
      const winner = users[winnerIndex];

      function animate() {
        const randomName = users[Math.floor(Math.random() * users.length)];
        slotDisplay.innerText = randomName;
        counter++;

        if (counter < totalRounds) {
          if (counter > totalRounds - 15) {
            speed += 20;
          }
          setTimeout(animate, speed);
        } else {
          slotDisplay.innerText = winner;
          slotDisplay.classList.add('winner');
          
          fireConfetti();
          addWinnerToHistory(winner);

          rollBtn.disabled = false;
          isRolling = false;
        }
      }

      animate();
    }

    function fireConfetti() {
      confetti({
        particleCount: 120,
        spread: 70,
        origin: { y: 0.6 }
      });
    }

    function addWinnerToHistory(winner) {
      const list = document.getElementById('winnersList');
      const badge = document.createElement('div');
      badge.className = 'winner-badge';
      badge.innerHTML = `🎉 <span>${winner}</span>`;
      list.prepend(badge);
    }
  </script>
</body>
</html>
