<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IG Giveaway Picker</title>
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: #1f2833;
      --accent: #8a2be2;
      --accent-hover: #9d4edf;
      --text: #ffffff;
      --text-dim: #c5c6c7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

    .container { background: var(--card-bg); border-radius: 16px; width: 100%; max-width: 480px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05); }
    h1 { text-align: center; font-size: 1.5rem; margin-bottom: 20px; color: var(--text); }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; color: var(--text-dim); margin-bottom: 6px; }
    input[type="text"], textarea { width: 100%; background: #0f141c; border: 1px solid #333; color: #fff; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; outline: none; resize: vertical; }
    input:focus, textarea:focus { border-color: var(--accent); }

    .checkbox-group { display: flex; align-items: center; gap: 8px; cursor: pointer; margin-bottom: 8px; font-size: 0.85rem; }
    .checkbox-group input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }

    button { width: 100%; background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: background 0.2s, transform 0.1s; margin-top: 10px; }
    button:hover { background: var(--accent-hover); }
    button:active { transform: scale(0.98); }
    button:disabled { background: #444; cursor: not-allowed; }

    /* Roll UI */
    .roll-card { display: none; background: #141a22; border-radius: 12px; padding: 20px; text-align: center; border: 2px solid var(--accent); margin-top: 20px; }
    
    .prize-badge { display: inline-block; background: var(--accent); color: #fff; font-size: 0.75rem; font-weight: bold; padding: 4px 12px; border-radius: 20px; text-transform: uppercase; margin-bottom: 8px; }
    .prize-title { font-size: 1.2rem; color: #fff; font-weight: bold; margin-bottom: 15px; min-height: 1.5em; }
    
    .slot-machine { height: 60px; overflow: hidden; position: relative; border-radius: 8px; background: #0b0c10; border: 1px solid #2a2d34; }
    .slot-container { position: absolute; width: 100%; top: 0; }
    .slot-item { height: 60px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: bold; color: #fff; }

    .winners-list { margin-top: 20px; text-align: left; background: #0f141c; padding: 12px; border-radius: 8px; max-height: 180px; overflow-y: auto; font-size: 0.85rem; }
    .winner-item { padding: 8px 0; border-bottom: 1px solid #222; display: flex; flex-direction: column; gap: 2px; }
    .winner-item:last-child { border-bottom: none; }
    .winner-head { display: flex; justify-content: space-between; font-weight: bold; }
    .winner-head .num { color: var(--accent); }
    .winner-prize { font-size: 0.75rem; color: var(--text-dim); }
  </style>
</head>
<body>

<div class="container">
  <h1>IG Giveaway Picker</h1>

  <div id="setup-form">
    <div class="form-group">
      <label>Link příspěvku (jen pro pořádek):</label>
      <input type="text" id="postUrl" placeholder="https://www.instagram.com/p/...">
    </div>

    <div class="form-group">
      <label>Seznam výher (každá výhra na nový řádek, 1-10 výher):</label>
      <textarea id="prizesList" style="height: 70px;" placeholder="1. AK-47 | Redline&#10;2. VIP Rank na 1 měsíc&#10;3. 500 Coinů"></textarea>
    </div>

    <div class="form-group">
      <label>Vlož zkopírovaný text z IG (Ctrl+V):</label>
      <textarea id="rawData" style="height: 120px;" placeholder="Otevři IG v prohlížeči, odscroluj komentáře, stiskni Ctrl+A -> Ctrl+C a vlož sem..."></textarea>
    </div>

    <div class="form-group">
      <label class="checkbox-group">
        <input type="checkbox" id="requireTag" checked>
        Pouze komentáře s označením (@kamarád)
      </label>
      <label class="checkbox-group">
        <input type="checkbox" id="uniqueOnly" checked>
        Pouze 1 vstup na jednoho uživatele
      </label>
    </div>

    <button onclick="prepareRoll()">Příprava losování</button>
  </div>

  <div id="roll-section" class="roll-card">
    <div class="prize-badge" id="prizeBadge">1. MÍSTO</div>
    <div class="prize-title" id="displayPrize">---</div>
    
    <div class="slot-machine">
      <div class="slot-container" id="slotContainer">
        <div class="slot-item">???</div>
      </div>
    </div>

    <button id="rollBtn" onclick="spin()" style="margin-top: 15px;">Losovat tuto výhru</button>

    <div class="winners-list" id="winnersList" style="display: none;">
      <strong>Vyhrané ceny:</strong>
      <div id="winnersContainer" style="margin-top: 8px;"></div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
