<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Giveaway Picker 🎯</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(23, 32, 54, 0.6);
      --accent-grad: linear-gradient(135deg, #833ab4 0%, #fd1d1d 50%, #fcb045 100%);
      --glow-color: rgba(253, 29, 29, 0.4);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(131, 58, 180, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(253, 29, 29, 0.15) 0%, transparent 40%);
    }

    .container { max-width: 800px; width: 100%; display: flex; flex-direction: column; gap: 2rem; flex: 1; position: relative; }

    header { text-align: center; position: relative; }
    header h1 {
      font-size: 2.5rem; font-weight: 800;
      background: var(--accent-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    header p { color: var(--text-muted); font-size: 1rem; }

    .admin-btn {
      position: absolute; top: 0; right: 0;
      background: rgba(255,255,255,0.05); border: 1px solid var(--border-color);
      color: var(--text-muted); padding: 0.5rem 0.8rem; border-radius: 10px;
      cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: all 0.2s;
    }
    .admin-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }

    .glass-card {
      background: var(--card-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color); border-radius: 24px; padding: 2rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .slot-container {
      position: relative; min-height: 140px; padding: 1.5rem;
      background: rgba(0, 0, 0, 0.5); border-radius: 16px; border: 2px solid var(--border-color);
      overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8); margin-bottom: 1.5rem; text-align: center;
    }

    .slot-prize { font-size: 1.2rem; font-weight: 800; color: #fcb045; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.4rem; }
    .slot-name { font-size: 2.2rem; font-weight: 800; letter-spacing: 1px; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.3); }

    .slot-container.winner .slot-name {
      font-size: 2.6rem; background: var(--accent-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: pulse 0.5s infinite alternate;
    }

    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.06); } }

    .btn-main {
      width: 100%; padding: 1.2rem; border: none; border-radius: 16px;
      background: var(--accent-grad); color: #fff; font-size: 1.2rem; font-weight: 800;
      cursor: pointer; box-shadow: 0 10px 25px var(--glow-color); transition: all 0.3s ease;
    }
    .btn-main:hover { transform: translateY(-2px); box-shadow: 0 15px 35px var(--glow-color); }
    .btn-main:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .congrats-banner {
      background: var(--accent-grad); padding: 1.5rem; border-radius: 16px;
      text-align: center; font-size: 1.8rem; font-weight: 800; color: #fff;
      box-shadow: 0 10px 30px var(--glow-color); animation: fadeIn 0.5s ease;
    }

    .history-section { display: flex; flex-direction: column; gap: 1rem; }
    .history-list { display: flex; flex-direction: column; gap: 0.75rem; }

    .winner-badge {
      background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border-color);
      padding: 0.8rem 1.2rem; border-radius: 12px; font-weight: 600;
      display: flex; justify-content: space-between; align-items: center; animation: fadeIn 0.4s ease;
    }
    .winner-badge .prize-tag { color: #fcb045; font-weight: 800; }
    .winner-badge .user-tag { color: #fff; font-size: 1.1rem; }

    footer { margin-top: 3rem; text-align: center; color: var(--text-muted); font-size: 0.9rem; font-weight: 600; }
    footer span { background: var(--accent-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <button class="admin-btn" onclick="openAdmin()">🔒 Admin</button>
      <h1>INSTAGRAM LOSOVAČ 🎁</h1>
      <p>Exkluzivní losování výherců</p>
    </header>

    <main class="glass-card">
      <div id="slotContainer" class="slot-container">
        <div id="slotPrize" class="slot-prize">PŘIPRAVENO</div>
        <div id="slotDisplay" class="slot-name">---</div>
      </div>

      <div id="controlsContainer">
        <button id="rollBtn" class="btn-main" onclick="startRoll()">SPUSTIT LOSOVÁNÍ 🚀</button>
      </div>

      <div id="congratsBanner" class="congrats-banner hidden">
        🎉 GRATULUJEME VÝHERCŮM! 🎉
      </div>
    </main>

    <div class="glass-card history-section">
      <h3>🏆 Seznam výherců</h3>
      <div id="winnersList" class="history-list"></div>
    </div>
  </div>

  <footer>
    <p>© DEV - <span>BAFI</span> | BigMoments 2026</p>
  </footer>

  <script>
    let isRolling = false;
    let db = { prizes: [], users: [], winnersHistory: [] };

    window.onload = function() {
      loadDB();
      updateUI();
    };

    function loadDB() {
      const saved = localStorage.getItem('ig_picker_db');
      if (saved) db = JSON.parse(saved);
    }

    function saveDB() {
      localStorage.setItem('ig_picker_db', JSON.stringify(db));
    }

    function openAdmin() {
      const pass = prompt("Zadej heslo pro vstup do Administrace:");
      if (pass === "BMMDB") {
        window.location.href = "admin.html";
      } else if (pass !== null) {
        alert("❌ Nesprávné heslo!");
      }
    }

    function updateUI() {
      const slotPrize = document.getElementById('slotPrize');
      const congratsBanner = document.getElementById('congratsBanner');
      const controlsContainer = document.getElementById('controlsContainer');

      renderHistory();

      if (db.prizes.length > 0) {
        slotPrize.innerText = `NÁSLEDUJÍCÍ VÝHRA: ${db.prizes[0]}`;
        controlsContainer.classList.remove('hidden');
        congratsBanner.classList.add('hidden');
      } else if (db.winnersHistory.length > 0) {
        controlsContainer.classList.add('hidden');
        congratsBanner.classList.remove('hidden');
        slotPrize.innerText = "SOUTĚŽ UKONČENA";
        document.getElementById('slotDisplay').innerText = "Všechny ceny rozlosovány!";
      } else {
        slotPrize.innerText = "ŽÁDNÉ VÝHRY (PŘIHLAŠ SE DO ADMINU)";
        document.getElementById('slotDisplay').innerText = "Čekání na nastavení...";
      }
    }

    function startRoll() {
      loadDB();
      if (db.users.length === 0 || db.prizes.length === 0) {
        alert("⚠️ Žádní účastníci nebo výhry! Přejdi do Adminu (heslo BMMDB) a vlož je.");
        return;
      }
      if (isRolling) return;
      isRolling = true;

      const rollBtn = document.getElementById('rollBtn');
      const slotContainer = document.getElementById('slotContainer');
      const slotDisplay = document.getElementById('slotDisplay');
      const slotPrize = document.getElementById('slotPrize');
      
      rollBtn.disabled = true;
      slotContainer.classList.remove('winner');

      const currentPrize = db.prizes[0];
      const winnerIndex = Math.floor(Math.random() * db.users.length);
      const winner = db.users[winnerIndex];

      const duration = 3000;
      const startTime = Date.now();
      let intervalSpeed = 25;

      function animate() {
        const elapsedTime = Date.now() - startTime;

        if (elapsedTime < duration) {
          const randomName = db.users[Math.floor(Math.random() * db.users.length)];
          slotDisplay.innerText = randomName;
          if (elapsedTime > duration - 800) intervalSpeed += 5;
          setTimeout(animate, intervalSpeed);
        } else {
          slotDisplay.innerText = winner;
          slotPrize.innerText = `🎉 ${currentPrize}`;
          slotContainer.classList.add('winner');
          
          confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });

          db.winnersHistory.unshift({ prize: currentPrize, user: winner });
          db.prizes.shift();
          saveDB();

          rollBtn.disabled = false;
          isRolling = false;
          updateUI();
        }
      }

      animate();
    }

    function renderHistory() {
      const list = document.getElementById('winnersList');
      list.innerHTML = '';
      db.winnersHistory.forEach(item => {
        const badge = document.createElement('div');
        badge.className = 'winner-badge';
        badge.innerHTML = `
          <span class="prize-tag">🎁 ${item.prize}</span>
          <span class="user-tag">${item.user}</span>
        `;
        list.appendChild(badge);
      });
    }
  </script>
</body>
</html>
